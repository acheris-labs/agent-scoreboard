name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0, no v prefix)'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      NOTARY_PROFILE: scoreboard-notary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "→ tag=$TAG version=$VERSION"

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Stamp version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.v.outputs.version }}" app/Info.plist
          plutil -replace CFBundleVersion            -string "${{ steps.v.outputs.version }}" app/Info.plist
          sed -i '' 's/^version = ".*"/version = "${{ steps.v.outputs.version }}"/' cli/pyproject.toml

      # --- Code signing setup ----------------------------------------------
      - name: Import signing certificate
        env:
          DEVID_CERT_P12:      ${{ secrets.DEVID_CERT_P12 }}
          DEVID_CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVID_CERT_P12:?missing DEVID_CERT_P12 secret}"
          : "${DEVID_CERT_PASSWORD:?missing DEVID_CERT_PASSWORD secret}"

          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo "$DEVID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          OTHERS=$(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g' | grep -v "$KEYCHAIN_PATH" || true)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $OTHERS
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_PASSWORD:?missing APPLE_APP_PASSWORD secret}"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id   "$APPLE_ID" \
            --team-id    "$APPLE_TEAM_ID" \
            --password   "$APPLE_APP_PASSWORD"

      # --- Build / sign / notarize / DMG -----------------------------------
      - name: Build, sign, notarize, package DMG
        env:
          DEVID_IDENTITY: ${{ secrets.DEVID_IDENTITY }}
        run: |
          set -euo pipefail
          : "${DEVID_IDENTITY:?missing DEVID_IDENTITY secret}"
          make -C app dmg SIGN_ID="$DEVID_IDENTITY" NOTARY_PROFILE="$NOTARY_PROFILE"

      - name: Locate DMG
        id: dmg
        run: |
          VERSIONED="Scoreboard-${{ steps.v.outputs.version }}.dmg"
          mv app/build/Scoreboard.dmg "$VERSIONED"
          echo "path=$VERSIONED" >> "$GITHUB_OUTPUT"
          ls -la "$VERSIONED"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # --- Release ---------------------------------------------------------
      - name: Create or push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Extract the matching CHANGELOG.md section for this version. Falls back
      # to GitHub's --generate-notes if no entry exists, so a missing changelog
      # block doesn't break a release.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/        { exit }
              found                    { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ -s "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "→ using CHANGELOG.md section for $VERSION"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "→ no CHANGELOG entry for $VERSION; will fall back to --generate-notes"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--title "Scoreboard ${{ steps.v.outputs.version }}")
          if [ -n "${{ steps.notes.outputs.path }}" ]; then
            ARGS+=(--notes-file "${{ steps.notes.outputs.path }}")
          else
            ARGS+=(--generate-notes)
          fi
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${{ steps.v.outputs.tag }}" \
            "${ARGS[@]}" \
            "${{ steps.dmg.outputs.path }}"
