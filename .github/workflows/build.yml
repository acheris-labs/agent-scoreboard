name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Tests
        run: make test

      - name: Build app (ad-hoc, Release)
        run: make -C app app

      - name: Verify the embedded CLI is the CLI
        run: ./app/build/Scoreboard.app/Contents/Resources/scoreboard state || true

      - name: Verify ad-hoc signature
        run: codesign -dv app/build/Scoreboard.app 2>&1

      - name: Upload Scoreboard.app
        uses: actions/upload-artifact@v4
        with:
          name: Scoreboard.app
          path: app/build/Scoreboard.app
          if-no-files-found: error
